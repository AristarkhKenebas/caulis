# Faster builds: reuse the build configuration, task results, and build modules in parallel.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Where Caulis lives, for the POM of every published module (a release refuses to go out
# without them; see build-logic/src/main/kotlin/caulis.published.gradle.kts):
# (The groupId io.github.aristarkhkenebas is the GitHub account's: Central verifies it through
# GitHub, no domain needed. With a domain later: group in caulis.library.gradle.kts.)
caulis.website=https://github.com/AristarkhKenebas/caulis
caulis.scm=https://github.com/AristarkhKenebas/caulis
caulis.developer.id=AristarkhKenebas
caulis.developer.name=AristarkhKenebas

# The key releases are signed with (gpg's agent asks for its password; only the id is here).
signing.gnupg.keyName=07EA5506E18F7C8C
