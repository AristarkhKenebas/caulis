# All versions of the project live here, in one place.

[versions]
# The JDK that compiles, tests and runs Tessera.
java = "27"
# Bytecode version of the compiled classes. Kotlin 2.4 can produce at most 26;
# raise to the same value as `java` once Kotlin supports it (expected in 2.5).
java-bytecode = "26"
kotlin = "2.4.21"
junit = "6.1.3"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
