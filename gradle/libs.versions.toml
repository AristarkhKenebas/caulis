# All versions of the project live here, in one place.

[versions]
# Version of Caulis itself (what irisWM and other programs depend on).
caulis = "0.1.0-SNAPSHOT"
# The JDK that compiles, tests and runs Caulis.
java = "27"
# Bytecode version of the compiled classes. Kotlin 2.4 can produce at most 26;
# raise to the same value as `java` once Kotlin supports it (expected in 2.5).
java-bytecode = "26"
kotlin = "2.4.21"
junit = "6.1.3"
# Builds the API documentation website from the code comments.
dokka = "2.2.0"

# jextract turns C headers into Java FFM bindings. It is only needed to regenerate
# bindings (./gradlew :caulis-native:jextract), not for a normal build.
# Newest build at https://jdk.java.net/jextract/ ; the generated code runs on any JDK 22+.
jextract = "25-jextract+2-4"
jextract-url = "https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
jextract-sha256 = "d0cc481abc1adb16fb9514e1c5e0bfc08d38c29228bece667fb5054ceaffaa42"

[libraries]
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
