# All versions of the project live here, in one place.

[versions]
# Version of Caulis itself (what compositors built with it depend on).
caulis = "0.1.4"
# The JDK that compiles, tests and runs Caulis.
java = "27"
# Bytecode version of the compiled classes. Kotlin 2.4 can produce at most 26;
# raise to the same value as `java` once Kotlin supports it (expected in 2.5).
java-bytecode = "26"
kotlin = "2.4.21"
# Protocol Buffers: the messages of the IPC socket (caulis-ipc). The Java code made from
# caulis.proto is kept in the repository; protoc (no newer than this runtime) is only needed
# to make it again: ./gradlew :caulis-ipc:generateProto
protobuf = "4.36.2"
# LuaJ: Lua 5.2 on the JVM, for config.lua (caulis-lua).
luaj = "3.0.1"
junit = "6.1.3"
# Compose (desktop, without a window: scenes drawn into pictures) for caulis-compose.
compose = "1.12.2"
# Skia for Compose; the same version as Compose's own (its native part for Linux).
skiko = "0.150.2"
# Builds the API documentation website from the code comments.
dokka = "2.2.0"

# jextract turns C headers into Java FFM bindings. It is only needed to regenerate
# bindings (./gradlew :caulis-native:jextract), not for a normal build.
# Newest build at https://jdk.java.net/jextract/ ; the generated code runs on any JDK 22+.
jextract = "25-jextract+2-4"
jextract-url = "https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
jextract-sha256 = "d0cc481abc1adb16fb9514e1c5e0bfc08d38c29228bece667fb5054ceaffaa42"

[libraries]
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# Compiles @Composable functions (the same version as Kotlin).
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime-desktop", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation-desktop", version.ref = "compose" }
skiko-linux = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
# The Kotlin compiler, run inside the compositor for fast hot reload (caulis-reload only).
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
# Kotlin's incremental compilation (Build Tools API, as the Gradle plugin uses it) — caulis-reload only.
kotlin-build-tools-api = { module = "org.jetbrains.kotlin:kotlin-build-tools-api", version.ref = "kotlin" }
kotlin-build-tools-impl = { module = "org.jetbrains.kotlin:kotlin-build-tools-impl", version.ref = "kotlin" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
luaj = { module = "org.luaj:luaj-jse", version.ref = "luaj" }
# Kotlin scripting: config.kts without Gradle (caulis-script).
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
