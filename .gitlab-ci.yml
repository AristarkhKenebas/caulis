# Builds and tests Caulis on GitLab (same steps as GitHub: ci/build.sh).
image: eclipse-temurin:27-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

cache:
  key: gradle
  paths:
    - .gradle-home/caches/
    - .gradle-home/wrapper/

stages:
  - build
  - release

build:
  stage: build
  timeout: 30m
  script:
    - ci/install-deps-debian.sh
    - ci/build.sh
  artifacts:
    when: always
    paths:
      - caulis-*/build/libs/
      - "**/build/reports/tests/"
    reports:
      junit: "**/build/test-results/test/*.xml"

# newm, the biggest user of Caulis, built and tested against this commit's sources.
newm:
  stage: build
  timeout: 30m
  script:
    - ci/install-deps-debian.sh
    - ci/build-newm.sh

# The API documentation website on GitLab Pages (from the main branch).
pages:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - ./gradlew --console=plain --no-daemon dokkaGenerate
    - mv build/dokka/html public
  artifacts:
    paths:
      - public

# A version tag (v0.1.0) publishes a GitLab release with the build's jars.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Caulis $CI_COMMIT_TAG"
    description: "Caulis $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Build artifacts (jars)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse?job=build"
