# All versions irisWM uses live here, in one place.

[versions]
# The JDK that compiles and runs irisWM.
java = "27"
# Bytecode version of the compiled classes. Kotlin 2.4 can produce at most 26;
# raise to the same value as `java` once Kotlin supports it (expected in 2.5).
java-bytecode = "26"
kotlin = "2.4.21"
junit = "6.1.3"
caulis = "0.1.0-SNAPSHOT"

[libraries]
caulis-core = { module = "dev.caulis:caulis-core", version.ref = "caulis" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
