# Builds and tests Caulis and irisWM on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@v6

      - name: System libraries
        run: ci/install-deps-debian.sh

      - name: Build and test
        run: ci/build.sh

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: irisWM archives
        uses: actions/upload-artifact@v7
        with:
          name: iriswm
          path: apps/iriswm/build/distributions/
