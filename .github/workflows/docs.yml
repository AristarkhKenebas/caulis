# Builds the API documentation website and puts it on GitHub Pages, under api/:
# https://aristarkhkenebas.github.io/caulis/api/
#
# Pages is served from the branch gh-pages (Settings → Pages → Source: "Deploy from a branch",
# gh-pages, / (root)), which also holds the Maven repository (maven/, written by
# ci/publish-github-pages.sh). This job changes only api/ there.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the website
        run: ./gradlew --console=plain dokkaGenerate

      - name: Put it on the branch gh-pages, under api/
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "No branch gh-pages yet (ci/publish-github-pages.sh begins it): nothing to update."
            exit 0
          fi
          git fetch --depth=1 origin gh-pages
          git worktree add pages FETCH_HEAD
          rm -rf pages/api
          cp -r build/dokka/html pages/api
          cd pages
          git add -A api
          if git diff --cached --quiet; then
            echo "The documentation did not change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "API documentation of ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
