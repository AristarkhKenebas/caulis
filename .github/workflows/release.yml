# Publishes a release when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The irisWM archives are attached to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@v6

      - name: System libraries
        run: ci/install-deps-debian.sh

      - name: Build and test
        run: ci/build.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "irisWM $GITHUB_REF_NAME" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            apps/iriswm/build/distributions/*
